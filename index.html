<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naima Waris - Birthday Countdown</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 30%, #1a1a2e 60%, #0f0c29 100%);
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Animated Background Gradient */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 105, 180, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(147, 51, 234, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            animation: bgShift 8s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes bgShift {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* Floating Hearts Container */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.6);
            animation: float-up linear infinite;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        }

        .heart:nth-child(3n) {
            color: rgba(236, 72, 153, 0.5);
        }

        .heart:nth-child(3n+1) {
            color: rgba(168, 85, 247, 0.5);
        }

        .heart:nth-child(3n+2) {
            color: rgba(59, 130, 246, 0.5);
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(90vh) rotate(45deg) scale(1);
            }
            25% {
                transform: translateY(75vh) rotate(90deg) scale(1.1);
            }
            50% {
                transform: translateY(50vh) rotate(180deg) scale(1);
            }
            75% {
                transform: translateY(25vh) rotate(270deg) scale(1.1);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg) scale(0.5);
                opacity: 0;
            }
        }

        /* Main Container */
        .main-container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
        }

        /* Name Display */
        .name-display {
            margin-bottom: 2rem;
            animation: fadeInDown 1.5s ease-out;
        }

        .name-label {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 0.5rem;
            letter-spacing: 3px;
        }

        .name-main {
            font-family: 'Great Vibes', cursive;
            font-size: 5rem;
            background: linear-gradient(45deg, #ff69b4, #ff1493, #ec4899, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 300% 300%;
            animation: gradientShift 3s ease infinite, pulse 2s ease-in-out infinite;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(255, 105, 180, 0.5));
            line-height: 1.2;
        }

        .name-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: #ffd700;
            margin-top: 0.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: fadeInUp 1.5s ease-out 0.5s both;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Countdown Section */
        .countdown-section {
            margin-top: 3rem;
            animation: fadeInUp 1.5s ease-out 0.8s both;
        }

        .countdown-label {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .time-unit {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 105, 180, 0.3);
            border-radius: 25px;
            padding: 2rem 1.5rem;
            min-width: 130px;
            transition: all 0.4s ease;
            overflow: hidden;
        }

        .time-unit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 105, 180, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .time-unit:hover::before {
            left: 100%;
        }

        .time-unit:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: rgba(255, 105, 180, 0.8);
            box-shadow: 
                0 20px 40px rgba(255, 105, 180, 0.3),
                0 0 60px rgba(255, 105, 180, 0.1),
                inset 0 0 20px rgba(255, 105, 180, 0.1);
        }

        .time-number {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(180deg, #ff69b4, #ff1493);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
            line-height: 1;
            position: relative;
            z-index: 1;
        }

        .time-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 0.8rem;
            font-weight: 300;
        }

        /* Decorative Elements */
        .decoration {
            position: absolute;
            font-size: 2rem;
            animation: float 6s ease-in-out infinite;
            opacity: 0.6;
            z-index: 1;
        }

        .decoration:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .decoration:nth-child(2) { top: 20%; right: 15%; animation-delay: 1s; }
        .decoration:nth-child(3) { bottom: 20%; left: 15%; animation-delay: 2s; }
        .decoration:nth-child(4) { bottom: 15%; right: 10%; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .name-main { font-size: 3.5rem; }
            .name-label { font-size: 1.4rem; }
            .time-number { font-size: 2.5rem; }
            .time-unit { min-width: 100px; padding: 1.5rem 1rem; }
            .countdown-container { gap: 1rem; }
        }

        /* Glow Effect */
        .glow-text {
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            from { filter: drop-shadow(0 0 20px rgba(255, 105, 180, 0.4)); }
            to { filter: drop-shadow(0 0 40px rgba(255, 105, 180, 0.8)); }
        }
    </style>
</head>
<body>
    <!-- Floating Hearts Background -->
    <div class="hearts-container" id="hearts"></div>

    <!-- Decorative Floating Elements -->
    <div class="decoration">✨</div>
    <div class="decoration">💕</div>
    <div class="decoration">💖</div>
    <div class="decoration">✨</div>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Name Display -->
        <div class="name-display">
            <div class="name-label">Counting Down For</div>
            <div class="name-main glow-text">Naima Waris</div>
            <div class="name-subtitle">21st Birthday</div>
        </div>

        <!-- Countdown Clock -->
        <div class="countdown-section">
            <div class="countdown-label">Time Until Your Special Day</div>
            <div class="countdown-container">
                <div class="time-unit">
                    <span class="time-number" id="days">00</span>
                    <div class="time-label">Days</div>
                </div>
                <div class="time-unit">
                    <span class="time-number" id="hours">00</span>
                    <div class="time-label">Hours</div>
                </div>
                <div class="time-unit">
                    <span class="time-number" id="minutes">00</span>
                    <div class="time-label">Minutes</div>
                </div>
                <div class="time-unit">
                    <span class="time-number" id="seconds">00</span>
                    <div class="time-label">Seconds</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Create Floating Hearts
        function createHearts() {
            const container = document.getElementById('hearts');
            const heartSymbols = ['❤', '💖', '💕', '💗', '💝', '💘', '💓', '💞'];

            // Create initial hearts
            for (let i = 0; i < 15; i++) {
                setTimeout(() => spawnHeart(container, heartSymbols), i * 300);
            }

            // Continue creating hearts
            setInterval(() => {
                spawnHeart(container, heartSymbols);
            }, 400);
        }

        function spawnHeart(container, symbols) {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 6 + 8) + 's';
            heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
            heart.style.opacity = Math.random() * 0.5 + 0.3;
            container.appendChild(heart);

            setTimeout(() => heart.remove(), 14000);
        }

        createHearts();

        // Countdown Timer
        function updateCountdown() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);

            const diff = tomorrow - now;

            if (diff <= 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
